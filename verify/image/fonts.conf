<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Do not include /etc/fonts/conf.d: that would discover host/distribution faces. -->
  <dir>/opt/fonts/files</dir>
  <cachedir>/opt/font-cache</cachedir>
  <alias><family>sans-serif</family><prefer><family>KaTeX_SansSerif</family></prefer></alias>
  <alias><family>serif</family><prefer><family>KaTeX_Main</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>KaTeX_Typewriter</family></prefer></alias>
  <!-- Requests for unavailable platform families are reported by the capture, not supplied
       with an unreviewed system font. These fallbacks are already shipped in the app. -->
</fontconfig>
